<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <link rel="stylesheet" href="../CSS/about.css">
</head>
<body>
    <main>
        <div class="about_main-1">
            <img class="about_main-1_decor-1" src="../IMG/Group 8.png">
            <img class="about_main-1_decor-2" src="../IMG/Group 8 Copy.png">

            <div class="about_main-1_wrap">
                <div class="about_main-1_meet-directors">
                    <h2>Meet the directors</h2>
                </div>
                    
                <div class="about_main-1_directors">
                    <div class="about_main-1_directors-tile">
                        <img src="../IMG/nikita.png" alt="a picture of founder & CEO, Nikita Marks">
                        <p>Nikita Marks</p>
                        <p>Founder & CEO</p>
                        <div class="about_main-1_directors-tile_plus">+</div>
                    </div>
                    <div class="about_main-1_directors-tile">
                        <img src="../IMG/christian.png" alt="a picture of co-founder & COO, Cristian Duncan">
                        <p>Cristian Duncan</p>
                        <p>Co-founder & COO</p>
                        <div class="about_main-1_directors-tile_plus">+</div>
                    </div>
                    <div class="about_main-1_directors-tile">
                        <img src="../IMG/cruz.png" alt="a picture of co-founder & CTO, Cruz Hamer">
                        <p>Cruz Hamer</p>
                        <p>Co-founder & CTO</p>
                        <div class="about_main-1_directors-tile_plus">+</div>
                    </div>
                    <div class="about_main-1_directors-tile">
                        <img src="../IMG/drake.png" alt="a picture of business development lead, Drake Heaton">
                        <p>Drake Heaton</p>
                        <p>Business Development Lead</p>
                        <div class="about_main-1_directors-tile_plus">+</div>
                    </div>
                    <div class="about_main-1_directors-tile">
                        <img src="../IMG/griffin.png" alt="a picture of marketing lead, Griffin Wise">
                        <p>Griffin Wise</p>
                        <p>Lead Marketing</p>
                        <div class="about_main-1_directors-tile_plus">+</div>
                    </div>
                    <div class="about_main-1_directors-tile">
                        <img src="../IMG/aden.png" alt="a picture of operations lead, Aden Allan">
                        <p>Aden Allan</p>
                        <p>Lead Operations</p>
                        <div class="about_main-1_directors-tile_plus">+</div>
                    </div>
                </div>
            </div>
        </div>
        <!-- main part 2 -->
        <div class="about_main-2">
            <img class="about_main-2_decor" src="../IMG/Group 8-3.svg">

            <div class="about_main-2_wrap">
                <div class="about_main-2_some-clients">
                    <h2>Some of our clients</h2>
                </div>
                <div class="about_main-2_clients">
                    <div class="about_main-2_clients-box">
                        <img src="../IMG/theverge-logo.png" alt="logo of the verge">
                    </div>
                    <div class="about_main-2_clients-box">
                        <img src="../IMG/thejakartapost-logo.png" alt="logo of the jakarta post">
                    </div>
                    <div class="about_main-2_clients-box">
                        <img src="../IMG/theguardian-logo.png" alt="logo of the guardian">
                    </div>
                    <div class="about_main-2_clients-box">
                        <img src="../IMG/techradar-logo.png" alt="logo of techradar">
                    </div>
                    <div class="about_main-2_clients-box">
                        <img src="../IMG/gadgetsnow-logo.png" alt="logo of gadgets now">
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
